<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Immersive Exhibit — 270°</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #000;
    width: 13578px;
    height: 1200px;
    overflow: hidden;
    font-family: monospace;
  }

  /* ── PICKER SCREEN ── */
  #picker-screen {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    background: #07070f;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 100;
    gap: 28px;
  }

  #picker-screen h1 {
    font-size: 20px;
    letter-spacing: 0.3em;
    color: rgba(255,255,255,0.7);
    text-transform: uppercase;
  }

  #picker-screen p {
    font-size: 13px;
    color: rgba(255,255,255,0.35);
    letter-spacing: 0.1em;
    text-align: center;
    line-height: 1.9;
  }

  #pick-btn {
    background: transparent;
    border: 1px solid rgba(255,255,255,0.25);
    color: rgba(255,255,255,0.75);
    font-family: monospace;
    font-size: 13px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    padding: 14px 36px;
    cursor: pointer;
    transition: border-color 0.2s, color 0.2s;
  }
  #pick-btn:hover { border-color: rgba(255,255,255,0.6); color: #fff; }

  #picker-error {
    font-size: 12px;
    color: rgba(255,100,100,0.7);
    letter-spacing: 0.1em;
    display: none;
  }

  /* ── EXHIBIT ── */
  #exhibit {
    position: absolute;
    top: 0; left: 0;
    width: 13578px;
    height: 1200px;
    display: none;
    flex-direction: row;
  }

  .panel {
    flex: 0 0 1508.67px;   /* 13578 / 9 = 1508.666… */
    width: 1508.67px;
    height: 1200px;
    position: relative;
    overflow: hidden;
    background: #000;
    border-right: 1px solid rgba(255,255,255,0.05);
  }
  .panel:last-child { border-right: none; }

  .panel-media {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .panel-media img,
  .panel-media video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  /* subtle panel-number label */
  .panel-num {
    position: absolute;
    bottom: 10px;
    right: 12px;
    font-size: 10px;
    letter-spacing: 0.2em;
    color: rgba(255,255,255,0.12);
    pointer-events: none;
    z-index: 2;
  }
</style>
</head>
<body>

<div id="picker-screen">
  <h1>Immersive Exhibit</h1>
  <p>Select the folder on your computer that contains<br>the exhibit images and videos.</p>
  <button id="pick-btn">Select Content Folder</button>
  <div id="picker-error"></div>
</div>

<div id="exhibit">
  <div class="panel"><div class="panel-media" id="media-0"></div><span class="panel-num">01</span></div>
  <div class="panel"><div class="panel-media" id="media-1"></div><span class="panel-num">02</span></div>
  <div class="panel"><div class="panel-media" id="media-2"></div><span class="panel-num">03</span></div>
  <div class="panel"><div class="panel-media" id="media-3"></div><span class="panel-num">04</span></div>
  <div class="panel"><div class="panel-media" id="media-4"></div><span class="panel-num">05</span></div>
  <div class="panel"><div class="panel-media" id="media-5"></div><span class="panel-num">06</span></div>
  <div class="panel"><div class="panel-media" id="media-6"></div><span class="panel-num">07</span></div>
  <div class="panel"><div class="panel-media" id="media-7"></div><span class="panel-num">08</span></div>
  <div class="panel"><div class="panel-media" id="media-8"></div><span class="panel-num">09</span></div>
</div>

<script>
const IMAGE_DURATION_MS = 2 * 60 * 1000; // 2 minutes
const IMAGE_EXTS = new Set(['jpg','jpeg','png','gif','webp','svg','avif','bmp']);
const VIDEO_EXTS = new Set(['mp4','webm','mov','ogg','m4v']);
const NUM_PANELS  = 9;

let contentFiles = [];

// Per-panel state
const panels = Array.from({ length: NUM_PANELS }, (_, i) => ({
  index:      i,
  lastFile:   -1,
  timer:      null,
  objectURL:  null,
  videoEl:    null,
}));

function getExt(name) { return name.split('.').pop().toLowerCase(); }
function isImage(f)   { return IMAGE_EXTS.has(getExt(f.name)); }
function isVideo(f)   { return VIDEO_EXTS.has(getExt(f.name)); }

// ── FOLDER PICKER ──
document.getElementById('pick-btn').addEventListener('click', async () => {
  const errEl = document.getElementById('picker-error');
  errEl.style.display = 'none';
  try {
    const dirHandle = await window.showDirectoryPicker({ mode: 'read' });
    const files = [];
    for await (const entry of dirHandle.values()) {
      if (entry.kind === 'file') {
        const file = await entry.getFile();
        const ext  = getExt(file.name);
        if (IMAGE_EXTS.has(ext) || VIDEO_EXTS.has(ext)) files.push(file);
      }
    }
    if (files.length === 0) {
      errEl.textContent = 'No supported images or videos found in that folder.';
      errEl.style.display = 'block';
      return;
    }
    contentFiles = files;
    launchExhibit();
  } catch (err) {
    if (err.name === 'AbortError') return;
    if (err.name === 'SecurityError' || typeof window.showDirectoryPicker === 'undefined') {
      useFallbackPicker();
    } else {
      errEl.textContent = 'Could not open folder: ' + err.message;
      errEl.style.display = 'block';
    }
  }
});

function useFallbackPicker() {
  const input = document.createElement('input');
  input.type = 'file';
  input.multiple = true;
  input.accept = 'image/*,video/*';
  input.setAttribute('webkitdirectory', '');
  input.addEventListener('change', () => {
    const files = Array.from(input.files).filter(f => {
      const ext = getExt(f.name);
      return IMAGE_EXTS.has(ext) || VIDEO_EXTS.has(ext);
    });
    const errEl = document.getElementById('picker-error');
    if (files.length === 0) {
      errEl.textContent = 'No supported images or videos found in that folder.';
      errEl.style.display = 'block';
      return;
    }
    contentFiles = files;
    launchExhibit();
  });
  input.click();
}

function launchExhibit() {
  document.getElementById('picker-screen').style.display = 'none';
  const ex = document.getElementById('exhibit');
  ex.style.display = 'flex';
  // Kick off each panel independently with a small staggered delay
  panels.forEach((p, i) => {
    setTimeout(() => loadPanel(p), i * 300);
  });
}

// ── PER-PANEL PLAYBACK ──

function pickForPanel(p) {
  if (contentFiles.length === 1) return 0;
  let next;
  do { next = Math.floor(Math.random() * contentFiles.length); }
  while (next === p.lastFile);
  return next;
}

function clearPanel(p) {
  clearTimeout(p.timer);
  p.timer = null;
  if (p.videoEl) { p.videoEl.pause(); p.videoEl = null; }
  const slot = document.getElementById('media-' + p.index);
  slot.innerHTML = '';
  if (p.objectURL) { URL.revokeObjectURL(p.objectURL); p.objectURL = null; }
}

function loadPanel(p) {
  clearPanel(p);

  const idx  = pickForPanel(p);
  p.lastFile  = idx;
  const file  = contentFiles[idx];
  const url   = URL.createObjectURL(file);
  p.objectURL = url;
  const slot  = document.getElementById('media-' + p.index);

  if (isVideo(file)) {
    const vid = document.createElement('video');
    vid.src         = url;
    vid.autoplay    = true;
    vid.muted       = true;
    vid.loop        = false;
    vid.playsInline = true;
    vid.addEventListener('ended', () => loadPanel(p));
    vid.addEventListener('error', () => {
      console.warn('Video error on panel', p.index, file.name);
      setTimeout(() => loadPanel(p), 1500);
    });
    vid.play().catch(() => {});
    p.videoEl = vid;
    slot.appendChild(vid);

  } else if (isImage(file)) {
    const img = document.createElement('img');
    img.src = url;
    img.alt = '';
    img.onerror = () => {
      console.warn('Image error on panel', p.index, file.name);
      setTimeout(() => loadPanel(p), 1500);
    };
    slot.appendChild(img);
    p.timer = setTimeout(() => loadPanel(p), IMAGE_DURATION_MS);

  } else {
    // unsupported — skip immediately
    setTimeout(() => loadPanel(p), 500);
  }
}
</script>
</body>
</html>
